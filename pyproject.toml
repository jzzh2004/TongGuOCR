[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tongguocr"
version = "1.0.0"
description = "TongGuOCR: OCR for classical Chinese documents (layout + block + recognition)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Install the tested runtime with tools/setup_env.sh. The optional vLLM
# server uses a separate environment; see tools/setup_vllm_env.sh.
dependencies = []

[project.scripts]
tongguocr = "tongguocr.cli:main"

[tool.setuptools.packages.find]
include = ["tongguocr*"]

[tool.setuptools.package-data]
tongguocr = ["layout/hdc_speed.py"]
