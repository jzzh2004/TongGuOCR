[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tongguocr"
version = "1.0.0"
description = "TongGuOCR: OCR for classical Chinese documents (layout + block + recognition)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES*.md", "THIRD_PARTY_LICENSES/*.md"]
# Install the tested runtime with tools/setup_env.sh. The optional vLLM
# server uses a separate environment; see tools/setup_vllm_env.sh.
dependencies = []

[project.scripts]
tongguocr = "tongguocr.cli:main"

[tool.setuptools.packages.find]
include = ["tongguocr*"]
